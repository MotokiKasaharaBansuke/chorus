[package]
name = "chorus"
version = "0.1.0"
description = "Chorus: macOS desktop app for managing multiple AI coding assistants in parallel"
authors = ["kasaharamotoki"]
edition = "2021"

[lib]
name = "chorus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ignore = "0.4"
base64 = "0.22"
which = "7"
shell-escape = "0.1"
